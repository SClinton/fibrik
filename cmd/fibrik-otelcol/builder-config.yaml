# OpenTelemetry Collector Builder (OCB) manifest for fibrik-otelcol.
# Standard components only for now; the Fibrik object_storage, http_pull and
# webhook receivers (connectors-framework.md) are added here as they land.
dist:
  name: fibrik-otelcol
  description: Fibrik OpenTelemetry Collector distribution
  output_path: ./_build
  version: 0.1.0

receivers:
  - gomod: go.opentelemetry.io/collector/receiver/otlpreceiver v0.163.0
  - gomod: github.com/open-telemetry/opentelemetry-collector-contrib/receiver/syslogreceiver v0.163.0

processors:
  - gomod: go.opentelemetry.io/collector/processor/batchprocessor v0.163.0
  - gomod: go.opentelemetry.io/collector/processor/memorylimiterprocessor v0.163.0
  - gomod: github.com/open-telemetry/opentelemetry-collector-contrib/processor/resourceprocessor v0.163.0

exporters:
  - gomod: go.opentelemetry.io/collector/exporter/otlpexporter v0.163.0
  - gomod: go.opentelemetry.io/collector/exporter/debugexporter v0.163.0

extensions:
  - gomod: github.com/open-telemetry/opentelemetry-collector-contrib/extension/healthcheckextension v0.163.0
  - gomod: github.com/open-telemetry/opentelemetry-collector-contrib/extension/storage v0.163.0
    import: github.com/open-telemetry/opentelemetry-collector-contrib/extension/storage/filestorage

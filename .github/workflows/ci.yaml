# All logic lives in the Makefile; this file only calls make targets
# (initial-stack.md §0 rule 5).
name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - run: make tools
      - run: make ci-lint

  kind:
    # Portability proof, target 1 of 3 (initial-stack.md §8): same chart on kind (amd64).
    needs: lint
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - run: make tools
      - run: make ci-kind PROFILE=ci
      - if: failure()
        run: make diag
      - if: always()
        run: make kind-down

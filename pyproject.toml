[build-system]
requires = ["hatchling==1.32.4"]
build-backend = "hatchling.build"

[project]
name = "fibrik"
version = "0.1.0"
description = "Fibrik, the Open Security Data Fabric for Agentic AI"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.12"
dependencies = [
  "clickhouse-connect==1.10.0",
  "fastapi==0.143.1",
  "httpx==0.28.1",
  "pyarrow==26.0.0",
  "pydantic-settings==2.16.0",
  "pyiceberg[pyarrow,pyiceberg-core]==0.12.0",
  "typer==0.27.3",
  "uvicorn==0.54.0",
]

[project.optional-dependencies]
dev = [
  "pyiceberg[pyarrow,pyiceberg-core,sql-sqlite]==0.12.0",
  "pytest==9.1.1",
  "ruff==0.17.0",
]

[project.scripts]
fibrik = "fibrik.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["fibrik"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]

{{- if .Values.otelcol.enabled }}
{{- $name := include "fibrik.component" (list . "otelcol") }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ $name }}-config
  labels:
    {{- include "fibrik.labels" (list . "otelcol") | nindent 4 }}
data:
  config.yaml: |
    extensions:
      health_check:
        endpoint: 0.0.0.0:13133
      file_storage:
        directory: /var/lib/otelcol/queue
        create_directory: true
    receivers:
      otlp:
        protocols:
          grpc: { endpoint: 0.0.0.0:4317 }
          http: { endpoint: 0.0.0.0:4318 }
      {{- if .Values.otelcol.syslog.enabled }}
      syslog/tcp:
        tcp: { listen_address: "0.0.0.0:{{ .Values.otelcol.syslog.port }}" }
        protocol: rfc5424
      {{- end }}
    processors:
      memory_limiter:
        check_interval: 1s
        limit_percentage: 80
        spike_limit_percentage: 20
      resource/otlp:
        attributes:
          - { key: fibrik.source, value: otlp, action: insert }
      resource/syslog:
        attributes:
          - { key: fibrik.source, value: syslog, action: upsert }
      batch: {}
    exporters:
      otlp/vector:
        endpoint: {{ include "fibrik.component" (list . "vector") }}:4317
        tls: { insecure: true }
        sending_queue:
          enabled: true
          storage: file_storage
        retry_on_failure:
          enabled: true
    service:
      extensions: [health_check, file_storage]
      telemetry:
        metrics:
          readers:
            - pull:
                exporter:
                  prometheus: { host: 0.0.0.0, port: 8888 }
      pipelines:
        logs/otlp:
          receivers: [otlp]
          processors: [memory_limiter, resource/otlp, batch]
          exporters: [otlp/vector]
        {{- if .Values.otelcol.syslog.enabled }}
        logs/syslog:
          receivers: [syslog/tcp]
          processors: [memory_limiter, resource/syslog, batch]
          exporters: [otlp/vector]
        {{- end }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ $name }}
  labels:
    {{- include "fibrik.labels" (list . "otelcol") | nindent 4 }}
spec:
  type: {{ .Values.otelcol.service.type }}
  selector:
    {{- include "fibrik.selectorLabels" (list . "otelcol") | nindent 4 }}
  ports:
    - name: otlp-grpc
      port: 4317
      targetPort: otlp-grpc
    - name: otlp-http
      port: 4318
      targetPort: otlp-http
    {{- if .Values.otelcol.syslog.enabled }}
    - name: syslog
      port: {{ .Values.otelcol.syslog.port }}
      targetPort: syslog
    {{- end }}
---
# Health and metrics stay on a ClusterIP Service.
apiVersion: v1
kind: Service
metadata:
  name: {{ $name }}-internal
  labels:
    {{- include "fibrik.labels" (list . "otelcol") | nindent 4 }}
spec:
  selector:
    {{- include "fibrik.selectorLabels" (list . "otelcol") | nindent 4 }}
  ports:
    - name: health
      port: 13133
      targetPort: health
    - name: metrics
      port: 8888
      targetPort: metrics
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ $name }}
  labels:
    {{- include "fibrik.labels" (list . "otelcol") | nindent 4 }}
spec:
  serviceName: {{ $name }}
  replicas: 1
  selector:
    matchLabels:
      {{- include "fibrik.selectorLabels" (list . "otelcol") | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "fibrik.labels" (list . "otelcol") | nindent 8 }}
      annotations:
        checksum/config: {{ .Values.otelcol | toJson | sha256sum }}
    spec:
      securityContext:
        fsGroup: 65532
      containers:
        - name: otelcol
          image: {{ include "fibrik.ownImage" (list . "fibrik-otelcol") }}
          imagePullPolicy: {{ .Values.images.pullPolicy }}
          args: ["--config=/etc/otelcol/config.yaml"]
          ports:
            - name: otlp-grpc
              containerPort: 4317
            - name: otlp-http
              containerPort: 4318
            {{- if .Values.otelcol.syslog.enabled }}
            - name: syslog
              containerPort: {{ .Values.otelcol.syslog.port }}
            {{- end }}
            - name: health
              containerPort: 13133
            - name: metrics
              containerPort: 8888
          readinessProbe:
            httpGet:
              path: /
              port: health
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /
              port: health
            initialDelaySeconds: 15
            periodSeconds: 15
          resources:
            {{- toYaml .Values.otelcol.resources | nindent 12 }}
          volumeMounts:
            - name: data
              mountPath: /var/lib/otelcol
            - name: config
              mountPath: /etc/otelcol
              readOnly: true
      volumes:
        - name: config
          configMap:
            name: {{ $name }}-config
  volumeClaimTemplates:
    {{- include "fibrik.pvc" (list . .Values.otelcol.persistence.size) | nindent 4 }}
{{- end }}

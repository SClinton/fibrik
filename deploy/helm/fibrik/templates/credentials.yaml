{{- if not .Values.credentials.existingSecret }}
{{- $creds := include "fibrik.credentials" . | fromYaml }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "fibrik.credentialsSecret" . }}
  labels:
    {{- include "fibrik.labels" (list . "credentials") | nindent 4 }}
  annotations:
    # Keep generated credentials if the release is uninstalled, so the data
    # on the PVCs stays readable after a reinstall.
    helm.sh/resource-policy: keep
type: Opaque
stringData:
  {{- range $k, $v := $creds }}
  {{ $k }}: {{ $v | quote }}
  {{- end }}
{{- end }}

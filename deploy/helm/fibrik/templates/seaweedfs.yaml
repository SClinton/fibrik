{{- if .Values.seaweedfs.enabled }}
{{- $name := include "fibrik.component" (list . "seaweedfs") }}
{{- $creds := include "fibrik.credentials" . | fromYaml }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}-s3
  labels:
    {{- include "fibrik.labels" (list . "seaweedfs") | nindent 4 }}
type: Opaque
stringData:
  s3.json: |
    {{- dict "identities" (list (dict
      "name" "fibrik"
      "credentials" (list (dict "accessKey" (index $creds "s3-access-key-id") "secretKey" (index $creds "s3-secret-access-key")))
      "actions" (list "Admin" "Read" "Write" "List" "Tagging"))) | toJson | nindent 4 }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ $name }}
  labels:
    {{- include "fibrik.labels" (list . "seaweedfs") | nindent 4 }}
spec:
  selector:
    {{- include "fibrik.selectorLabels" (list . "seaweedfs") | nindent 4 }}
  ports:
    - name: s3
      port: 8333
      targetPort: s3
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ $name }}
  labels:
    {{- include "fibrik.labels" (list . "seaweedfs") | nindent 4 }}
spec:
  serviceName: {{ $name }}
  replicas: 1
  selector:
    matchLabels:
      {{- include "fibrik.selectorLabels" (list . "seaweedfs") | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "fibrik.labels" (list . "seaweedfs") | nindent 8 }}
      annotations:
        checksum/s3: {{ index $creds "s3-access-key-id" | sha256sum }}
    spec:
      containers:
        - name: seaweedfs
          image: {{ include "fibrik.image" .Values.seaweedfs.image }}
          # All-in-one mode: master, volume, filer and S3 in one process.
          args:
            - mini
            - -dir=/data
            - -ip=127.0.0.1
            - -s3.config=/etc/seaweedfs/s3.json
            - -bucket={{ .Values.storage.bucket }}
            - -admin.ui=false
          ports:
            - name: s3
              containerPort: 8333
          readinessProbe:
            tcpSocket:
              port: s3
            periodSeconds: 5
          livenessProbe:
            tcpSocket:
              port: s3
            initialDelaySeconds: 30
            periodSeconds: 15
          resources:
            {{- toYaml .Values.seaweedfs.resources | nindent 12 }}
          volumeMounts:
            - name: data
              mountPath: /data
            - name: s3
              mountPath: /etc/seaweedfs
              readOnly: true
      volumes:
        - name: s3
          secret:
            secretName: {{ $name }}-s3
  volumeClaimTemplates:
    {{- include "fibrik.pvc" (list . .Values.seaweedfs.persistence.size) | nindent 4 }}
{{- end }}

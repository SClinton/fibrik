{{- if .Values.dex.enabled }}
{{- $name := include "fibrik.component" (list . "dex") }}
{{- $creds := include "fibrik.credentials" . | fromYaml }}
{{- $config := dict
  "issuer" (printf "%s/dex" .Values.global.publicUrl)
  "storage" (dict
    "type" "postgres"
    "config" (dict
      "host" (include "fibrik.component" (list . "postgres"))
      "port" 5432
      "database" "dex"
      "user" "dex"
      "password" (index $creds "dex-db-password")
      "ssl" (dict "mode" "disable")))
  "web" (dict "http" "0.0.0.0:5556")
  "telemetry" (dict "http" "0.0.0.0:5558")
  "oauth2" (dict "skipApprovalScreen" true)
  "staticClients" (list (dict
    "id" .Values.dex.clientId
    "name" "Fibrik"
    "secret" (index $creds "dex-client-secret")
    "redirectURIs" (list (printf "%s/auth/callback" .Values.global.publicUrl))))
  "connectors" (tpl (toYaml .Values.dex.connectors) . | fromYamlArray)
  "enablePasswordDB" false
}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}-config
  labels:
    {{- include "fibrik.labels" (list . "dex") | nindent 4 }}
type: Opaque
stringData:
  config.yaml: |
    {{- toYaml $config | nindent 4 }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ $name }}
  labels:
    {{- include "fibrik.labels" (list . "dex") | nindent 4 }}
spec:
  selector:
    {{- include "fibrik.selectorLabels" (list . "dex") | nindent 4 }}
  ports:
    - name: http
      port: 5556
      targetPort: http
    - name: telemetry
      port: 5558
      targetPort: telemetry
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $name }}
  labels:
    {{- include "fibrik.labels" (list . "dex") | nindent 4 }}
spec:
  replicas: 1
  selector:
    matchLabels:
      {{- include "fibrik.selectorLabels" (list . "dex") | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "fibrik.labels" (list . "dex") | nindent 8 }}
      annotations:
        checksum/config: {{ toYaml $config | sha256sum }}
    spec:
      initContainers:
        {{- include "fibrik.waitForPostgres" . | nindent 8 }}
      containers:
        - name: dex
          image: {{ include "fibrik.image" .Values.dex.image }}
          args: ["dex", "serve", "/etc/dex/config.yaml"]
          {{- with .Values.dex.envFromSecret }}
          envFrom:
            - secretRef:
                name: {{ . }}
          {{- end }}
          ports:
            - name: http
              containerPort: 5556
            - name: telemetry
              containerPort: 5558
          readinessProbe:
            httpGet:
              path: /healthz/ready
              port: telemetry
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /healthz/live
              port: telemetry
            initialDelaySeconds: 15
            periodSeconds: 15
          resources:
            {{- toYaml .Values.dex.resources | nindent 12 }}
          volumeMounts:
            - name: config
              mountPath: /etc/dex
              readOnly: true
      volumes:
        - name: config
          secret:
            secretName: {{ $name }}-config
{{- end }}

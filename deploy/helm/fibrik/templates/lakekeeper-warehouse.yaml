{{- if and .Values.objectstore.enabled .Values.lakekeeper.enabled }}
{{- $objectstore := include "fibrik.component" (list . "objectstore") }}
{{- $lakekeeper := include "fibrik.component" (list . "lakekeeper") }}
# Bootstraps the Iceberg warehouse the lake writer and ClickHouse's Iceberg
# table functions both read/write (execution-plan.md §2.3 task 1: "the
# Lakekeeper warehouse, the S3 bucket"). Runs as a post-install/post-upgrade
# hook so it only fires after `helm upgrade --install --wait` has the
# objectstore and lakekeeper Services up; the wait-for-* init containers are
# a second, defensive check against a rescheduled hook pod racing a
# not-yet-ready dependency.
#
# Every step is idempotent (bootstrap and register-warehouse both treat 409
# as success; create-bucket ignores "already owned by you"), so re-running
# this hook on every `helm upgrade` -- the same approach lakekeeper.yaml's
# own `migrate` init container already uses -- is safe.
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "fibrik.component" (list . "lakekeeper-warehouse") }}
  labels:
    {{- include "fibrik.labels" (list . "lakekeeper-warehouse") | nindent 4 }}
  annotations:
    helm.sh/hook: post-install,post-upgrade
    helm.sh/hook-weight: "1"
    helm.sh/hook-delete-policy: before-hook-creation
spec:
  backoffLimit: 6
  template:
    metadata:
      labels:
        {{- include "fibrik.labels" (list . "lakekeeper-warehouse") | nindent 8 }}
    spec:
      restartPolicy: Never
      initContainers:
        - name: wait-for-objectstore
          image: {{ include "fibrik.image" .Values.tests.image }}
          command: ["sh", "-c", "until curl -s -o /dev/null http://{{ $objectstore }}:8333/; do echo waiting for objectstore; sleep 2; done"]
          resources:
            requests: { cpu: 10m, memory: 16Mi }
            limits: { memory: 64Mi }
        - name: wait-for-lakekeeper
          image: {{ include "fibrik.image" .Values.tests.image }}
          command: ["sh", "-c", "until curl -fsS http://{{ $lakekeeper }}:8181/health; do echo waiting for lakekeeper; sleep 2; done"]
          resources:
            requests: { cpu: 10m, memory: 16Mi }
            limits: { memory: 64Mi }
        - name: create-bucket
          image: {{ include "fibrik.image" .Values.objectstore.bootstrapImage }}
          env:
            {{- include "fibrik.objectstoreEnv" . | nindent 12 }}
          command: ["sh", "-c"]
          args:
            # us-east-1 is the one AWS region name that must NOT be passed as
            # a LocationConstraint, which is what lets this work unmodified
            # against SeaweedFS's S3 gateway too.
            - |
              set -eu
              aws --endpoint-url "$FIBRIK_OBJECTSTORE_ENDPOINT" s3api create-bucket \
                --bucket "$FIBRIK_LAKE_BUCKET" 2>&1 | tee /tmp/create-bucket.log || true
              grep -q BucketAlreadyOwnedByYou /tmp/create-bucket.log && exit 0
              aws --endpoint-url "$FIBRIK_OBJECTSTORE_ENDPOINT" s3api head-bucket --bucket "$FIBRIK_LAKE_BUCKET"
          resources:
            requests: { cpu: 10m, memory: 32Mi }
            limits: { memory: 128Mi }
      containers:
        - name: register-warehouse
          image: {{ include "fibrik.image" .Values.tests.image }}
          env:
            {{- include "fibrik.objectstoreEnv" . | nindent 12 }}
          command: ["sh", "-c"]
          args:
            # Request shape per Lakekeeper's Management API
            # (docs.lakekeeper.io/docs/nightly/storage-s3/): flavor
            # "s3-compat" for a non-AWS S3 endpoint, sts-enabled false since
            # this uses a static access-key credential, not STS (which
            # SeaweedFS doesn't implement). path-style-access: SeaweedFS's S3
            # gateway only serves path-style ("http://host/bucket/key"), not
            # virtual-hosted-style subdomains.
            - |
              set -eu
              # A fresh Lakekeeper server refuses every warehouse/project
              # call with 404 ProjectNotFound until it's bootstrapped --
              # found the hard way via a real CI run, not in the warehouse
              # docs (docs.lakekeeper.io/docs/nightly/bootstrap/). Bootstrap
              # also creates the default (NIL-id) project automatically
              # (LAKEKEEPER__ENABLE_DEFAULT_PROJECT defaults to on, and
              # lakekeeper.yaml doesn't override it), so no separate project
              # call is needed. No Authorization header: this deployment has
              # no OIDC/auth configured, so Lakekeeper runs in open mode.
              bootstrap_code=$(curl -sS -o /tmp/bootstrap-response.json -w "%{http_code}" \
                -X POST "http://{{ $lakekeeper }}:8181/management/v1/bootstrap" \
                -H "Content-Type: application/json" -d '{"accept-terms-of-use": true}')
              cat /tmp/bootstrap-response.json; echo
              case "$bootstrap_code" in
                2??) echo "lakekeeper bootstrapped" ;;
                409) echo "lakekeeper already bootstrapped" ;;
                *) echo "unexpected bootstrap status $bootstrap_code"; exit 1 ;;
              esac
              # No heredoc here -- its terminator would inherit this YAML
              # block's indentation and never match (see objectstore.yaml's
              # identical note). A double-quoted string tolerates embedded
              # newlines and expands $VARS the same way.
              body="{
                \"warehouse-name\": \"gold\",
                \"storage-credential\": {
                  \"type\": \"s3\",
                  \"credential-type\": \"access-key\",
                  \"aws-access-key-id\": \"$AWS_ACCESS_KEY_ID\",
                  \"aws-secret-access-key\": \"$AWS_SECRET_ACCESS_KEY\"
                },
                \"storage-profile\": {
                  \"type\": \"s3\",
                  \"flavor\": \"s3-compat\",
                  \"bucket\": \"$FIBRIK_LAKE_BUCKET\",
                  \"region\": \"$AWS_REGION\",
                  \"endpoint\": \"$FIBRIK_OBJECTSTORE_ENDPOINT\",
                  \"path-style-access\": true,
                  \"sts-enabled\": false,
                  \"key-prefix\": \"gold\"
                },
                \"delete-profile\": { \"type\": \"hard\" }
              }"
              http_code=$(curl -sS -o /tmp/warehouse-response.json -w "%{http_code}" \
                -X POST "http://{{ $lakekeeper }}:8181/management/v1/warehouse" \
                -H "Content-Type: application/json" -d "$body")
              cat /tmp/warehouse-response.json; echo
              case "$http_code" in
                2??) echo "warehouse created" ;;
                409) echo "warehouse already exists" ;;
                *) echo "unexpected status $http_code"; exit 1 ;;
              esac
              # Temporary diagnostics for a real, still-open 404 from
              # PyIceberg's GetConfig handshake against a warehouse that
              # demonstrably exists (see fibrik/lake/writer.py's comment) --
              # remove once the actual cause is confirmed and fixed. Prints
              # what Lakekeeper itself reports right after creation, from
              # the same pod, so there's no cross-pod timing question.
              echo "--- diag: list warehouses (Management API) ---"
              curl -sS "http://{{ $lakekeeper }}:8181/management/v1/warehouse"; echo
              echo "--- diag: list warehouses, explicit default project ---"
              curl -sS "http://{{ $lakekeeper }}:8181/management/v1/warehouse?projectId=00000000-0000-0000-0000-000000000000"; echo
              echo "--- diag: server-info ---"
              curl -sS "http://{{ $lakekeeper }}:8181/management/v1/info"; echo
              echo "--- diag: GetConfig with project-prefixed warehouse (what writer.py sends) ---"
              curl -sS -w "\nhttp_code=%{http_code}\n" "http://{{ $lakekeeper }}:8181/catalog/v1/config?warehouse=00000000-0000-0000-0000-000000000000/gold"
              echo "--- diag: GetConfig with bare warehouse name ---"
              curl -sS -w "\nhttp_code=%{http_code}\n" "http://{{ $lakekeeper }}:8181/catalog/v1/config?warehouse=gold"
          resources:
            requests: { cpu: 10m, memory: 32Mi }
            limits: { memory: 128Mi }
{{- end }}
